name: Refresh README Images

on:
  push:
    branches: [ '**' ]
    tags-ignore: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-readme-images:
    name: Render README pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install README render dependencies
        run: python -m pip install --upgrade pillow pypdfium2

      - name: Regenerate README images
        run: python scripts/update_readme_images.py

      - name: Commit regenerated README assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: refresh README images'
          file_pattern: 'README.md docs/readme/ReClip_Serverless_Media_Engine.pdf docs/screenshots/serverless-readme/*.jpg'
