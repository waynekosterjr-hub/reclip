name: ReClip Beta Pre-release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Beta tag to publish (for example: v1.1.0-beta.1)"
        required: true
        default: "v1.1.0-beta.1"
      release_title:
        description: "GitHub pre-release title"
        required: true
        default: "ReClip v1.1.0-beta.1"
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Beta
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
            RELEASE_TITLE="${{ github.event.inputs.release_title }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            RELEASE_TITLE="ReClip ${GITHUB_REF_NAME}"
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-debug.log

      - name: Build Release APK (unsigned)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build-release.log

      - name: Prepare beta artifacts
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ReClip-beta-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk ReClip-beta-release-unsigned.apk

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReClip-beta-artifacts
          path: |
            ReClip-beta-debug.apk
            ReClip-beta-release-unsigned.apk
            build-debug.log
            build-release.log
          retention-days: 30

      - name: Ensure tag exists (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if git rev-parse "${{ steps.meta.outputs.tag_name }}" >/dev/null 2>&1; then
            echo "Tag already exists: ${{ steps.meta.outputs.tag_name }}"
          else
            git tag "${{ steps.meta.outputs.tag_name }}"
            git push origin "${{ steps.meta.outputs.tag_name }}"
          fi

      - name: Build release notes body
        id: notes
        shell: bash
        run: |
          PREV_TAG=$(git tag --list 'v*-beta.*' --sort=-creatordate | grep -v "^${{ steps.meta.outputs.tag_name }}$" | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${{ steps.meta.outputs.tag_name }}"
          else
            RANGE="Initial beta release"
          fi

          cat > beta-release-notes.md <<EOF
          ## Highlights
          - Summarize major UX and feature updates in this beta.

          ## Breaking / Behavior Changes
          - Note any changed defaults, routing, or download behavior.

          ## Known Issues
          - List current known issues and workarounds.

          ## Install
          - Download \`ReClip-beta-debug.apk\` (recommended for testing) or \`ReClip-beta-release-unsigned.apk\`.
          - Sideload via ADB:
            \`adb install -r ReClip-beta-debug.apk\`

          ## Commit Range
          - ${RANGE}
          EOF

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_title }}
          prerelease: true
          body_path: beta-release-notes.md
          files: |
            ReClip-beta-debug.apk
            ReClip-beta-release-unsigned.apk
